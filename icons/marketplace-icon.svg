<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grundfarbe: satter Emerald-Verlauf -->
    <linearGradient id="g-base" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3DDC9A"/>
      <stop offset="0.5" stop-color="#0EA271"/>
      <stop offset="1" stop-color="#03543B"/>
    </linearGradient>

    <!-- Weiches Licht von oben links -->
    <radialGradient id="g-light" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Klassischer Gloss-Bogen auf der oberen Hälfte -->
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Reflexion vom unteren Rand -->
    <linearGradient id="g-bounce" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </linearGradient>

    <!-- Glaskante: oben hell, unten dunkel -->
    <linearGradient id="g-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00301F" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Frosted-Glass-Fläche des Ordners -->
    <linearGradient id="g-frost" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <clipPath id="clip-card">
      <rect x="0" y="0" width="128" height="128" rx="28"/>
    </clipPath>

    <filter id="f-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="f-drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#00301F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#clip-card)">
    <!-- Körper -->
    <rect width="128" height="128" fill="url(#g-base)"/>
    <rect width="128" height="128" fill="url(#g-light)"/>
    <rect width="128" height="128" fill="url(#g-bounce)"/>

    <!-- Gloss-Kappe -->
    <path d="M0 0H128V56C104 74 24 74 0 56Z" fill="url(#g-gloss)"/>

    <!-- Ordner-Symbol als Milchglas -->
    <g transform="translate(13 13) scale(4.25)">
      <path d="M2 5.5C2 4.67157 2.67157 4 3.5 4H9.17157C9.5694 4 9.95093 4.15804 10.2322 4.43934L11.5 5.70711C11.7812 5.98841 12.1628 6.14645 12.5607 6.14645H20.5C21.3284 6.14645 22 6.81802 22 7.64645V18.5C22 19.3284 21.3284 20 20.5 20H3.5C2.67157 20 2 19.3284 2 18.5V5.5Z"
            fill="url(#g-frost)"/>
    </g>
    <g transform="translate(13 13) scale(4.25)" fill="none" stroke="#FFFFFF" stroke-width="1.45"
       stroke-linejoin="round" stroke-linecap="round" filter="url(#f-drop)">
      <path d="M2 5.5C2 4.67157 2.67157 4 3.5 4H9.17157C9.5694 4 9.95093 4.15804 10.2322 4.43934L11.5 5.70711C11.7812 5.98841 12.1628 6.14645 12.5607 6.14645H20.5C21.3284 6.14645 22 6.81802 22 7.64645V18.5C22 19.3284 21.3284 20 20.5 20H3.5C2.67157 20 2 19.3284 2 18.5V5.5Z"/>
      <path d="M12 9.6V16.8"/>
      <path d="M8.87 11.39L15.13 15.01"/>
      <path d="M15.13 11.39L8.87 15.01"/>
    </g>

    <!-- Glanzstreifen quer über das Glas -->
    <path d="M-10 74L44 -10H70L16 74Z" fill="#FFFFFF" opacity="0.07" filter="url(#f-soft)"/>
    <path d="M24 74L60 -10H70L34 74Z" fill="#FFFFFF" opacity="0.05" filter="url(#f-soft)"/>
  </g>

  <!-- Glaskante -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#g-edge)" stroke-width="2"/>
</svg>
